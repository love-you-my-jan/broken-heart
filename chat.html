<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Companion AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #060203;
            --panel-bg: rgba(18, 8, 10, 0.75);
            --panel-border: rgba(255, 45, 85, 0.15);
            --accent-color: #ff2d55;
            --accent-glow: rgba(255, 45, 85, 0.4);
            --text-primary: #f5f5f7;
            --text-muted: #a09fa6;
            --ai-bubble: rgba(25, 12, 15, 0.85);
            --user-bubble: rgba(255, 45, 85, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Hind Siliguri', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particleCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .chat-app {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 5, 6, 0.4);
        }
        .chat-header h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }

        .chat-scroller {
            flex-grow: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .chat-scroller::-webkit-scrollbar { width: 5px; }
        .chat-scroller::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

        .msg-row { display: flex; width: 100%; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
        }
        .msg-row.ai .msg-bubble {
            background: var(--ai-bubble);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-top-left-radius: 4px;
        }
        .msg-row.user .msg-bubble {
            background: var(--user-bubble);
            border: 1px solid rgba(255, 45, 85, 0.2);
            border-top-right-radius: 4px;
        }

        .option-panel {
            padding: 10px 24px;
            display: flex;
            gap: 12px;
        }
        .option-pill {
            background: rgba(255, 45, 85, 0.08);
            border: 1px solid var(--panel-border);
            color: var(--text-primary);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option-pill:hover { background: var(--accent-color); border-color: var(--accent-color); transform: translateY(-2px); }

        .input-bar {
            padding: 16px 24px;
            border-top: 1px solid var(--panel-border);
            background: rgba(10, 5, 6, 0.5);
            display: flex;
            gap: 12px;
        }
        .input-field {
            flex-grow: 1;
            padding: 14px 20px;
            background: rgba(18, 10, 11, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            color: var(--text-primary);
            outline: none;
            font-size: 0.95rem;
        }
        .input-field:focus { border-color: var(--accent-color); }

        .send-btn {
            background: var(--accent-color);
            border: none; width: 48px; height: 48px;
            border-radius: 12px; color: white; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.3s;
        }
        .send-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px var(--accent-glow); }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="chat-app">
        <div class="chat-header">
            <h2 id="chatHeaderTitle"><i class="fa-solid fa-heart-crack"></i> মন-সঙ্গী AI</h2>
            <button class="option-pill" onclick="window.location.href='home.html'"><i class="fa-solid fa-house"></i> হোম</button>
        </div>

        <div class="chat-scroller" id="scroller">
            <!-- চ্যাট ডায়লগ এখানে ডায়নামিকালি যুক্ত হবে -->
        </div>

        <div class="option-panel" id="optionPanel" style="display: none;">
            <button class="option-pill" onclick="submitOption('হ্যাঁ')">হ্যাঁ (Yes)</button>
            <button class="option-pill" onclick="submitOption('না')">না (No)</button>
        </div>

        <div class="input-bar">
            <input type="text" id="userInput" class="input-field" placeholder="আপনার মনের লুকানো কথা বলুন..." onkeydown="handleEnter(event)">
            <button class="send-btn" onclick="submitText()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCjxAfqqg9i8C6G_O15y9NjkapVaLhpBlc",
            authDomain: "fir-1ef88.firebaseapp.com",
            databaseURL: "https://fir-1ef88-default-rtdb.firebaseio.com",
            projectId: "fir-1ef88",
            storageBucket: "fir-1ef88.firebasestorage.app",
            messagingSenderId: "564144231731",
            appId: "1:564144231731:web:d49ddc8a7ad87ecb311a46"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let currentUser = null;
        let userName = "বন্ধু"; // Fallback name
        let categoryId = sessionStorage.getItem('currentCategory') || 'broken_life';
        let categoryTitle = "কষ্টের কথা";
        let firebaseQuestions = [];
        let currentQuestionIdx = 0;
        let currentQuestionId = "";

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                currentUser = user;
                loadUserAndCategoryData();
            }
        });

        // 1. Load User First Name and Category Information dynamically
        function loadUserAndCategoryData() {
            // Load user first name
            database.ref('users/' + currentUser.uid).once('value', userSnapshot => {
                const userData = userSnapshot.val();
                if (userData && userData.firstName) {
                    userName = userData.firstName;
                }
                
                // Load category info
                database.ref('categories/' + categoryId).once('value', catSnapshot => {
                    const catData = catSnapshot.val();
                    if (catData && catData.title) {
                        categoryTitle = catData.title;
                        document.getElementById('chatHeaderTitle').innerHTML = `<i class="fa-solid fa-heart-crack"></i> মন-সঙ্গী: ${categoryTitle}`;
                    }
                    
                    // Proceed to load questions
                    loadCategoryQuestions();
                });
            });
        }

        // 2. Load Questions dynamically from RTDB
        function loadCategoryQuestions() {
            database.ref('questions/' + categoryId).once('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    firebaseQuestions = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                    
                    // Welcome Message with Personalized Category Name
                    appendMsg(`হ্যালো ${userName}, আপনি "${categoryTitle}" ক্যাটাগরি বেছে নিয়েছেন। চলুন আপনার মনের অপ্রকাশিত আবেগগুলো নিয়ে একটু শান্ত মনে কথা বলি।`, 'ai');
                    setTimeout(askNextQuestion, 1800);
                } else {
                    // Fallback to basic questions if no questions exist in DB
                    firebaseQuestions = [
                        { id: "fallback_1", questionText: "জীবনের এই সময়ে আপনি কি নিজেকে খুব অসহায় মনে করছেন?" },
                        { id: "fallback_2", questionText: "এমন কেউ কি আছে যাকে অবচেতন মনে এখনো মিস করেন?" }
                    ];
                    appendMsg(`হ্যালো ${userName}, চলুন আপনার মন খারাপের অনুভূতি নিয়ে কথা বলা যাক।`, 'ai');
                    setTimeout(askNextQuestion, 1800);
                }
            });
        }

        // 3. Prompt next dynamic personalized question
        function askNextQuestion() {
            if (currentQuestionIdx < firebaseQuestions.length) {
                const q = firebaseQuestions[currentQuestionIdx];
                currentQuestionId = q.id;
                
                // Personalize the question dynamic text with user's actual first name
                let formattedQuestion = q.questionText.replace(/{name}/g, userName);
                if (!formattedQuestion.includes(userName)) {
                    formattedQuestion = `${userName}, ${formattedQuestion}`;
                }

                appendMsg(formattedQuestion, 'ai');
                document.getElementById('optionPanel').style.display = 'flex';
                currentQuestionIdx++;
            } else {
                appendMsg(`${userName}, আপনার সাথে কথা বলে ভালো লাগলো। আপনার প্রতিটি দুঃখ ও বেদনার মুহূর্তগুলো কেটে গিয়ে নতুন সূর্য উঠুক। নিজের যত্ন নেবেন। ❤️`, 'ai');
                document.getElementById('optionPanel').style.display = 'none';
            }
        }

        function appendMsg(text, sender) {
            const scroller = document.getElementById('scroller');
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            row.innerHTML = `<div class="msg-bubble">${text}</div>`;
            scroller.appendChild(row);
            scroller.scrollTop = scroller.scrollHeight;
        }

        function submitOption(val) {
            appendMsg(val, 'user');
            saveAnswer(val);
            document.getElementById('optionPanel').style.display = 'none';
            
            setTimeout(() => {
                askNextQuestion();
            }, 1200);
        }

        function submitText() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (!val) return;
            input.value = "";
            appendMsg(val, 'user');
            saveAnswer(val);
            document.getElementById('optionPanel').style.display = 'none';

            setTimeout(() => {
                askNextQuestion();
            }, 1500);
        }

        function handleEnter(e) { if (e.key === 'Enter') submitText(); }

        // 4. Record response in Realtime Database under user's response node
        function saveAnswer(answerText) {
            if (!currentUser) return;
            const questionTextSaved = firebaseQuestions[currentQuestionIdx - 1]?.questionText || "Unknown Question";
            
            database.ref('user_responses/' + currentUser.uid).push({
                questionId: currentQuestionId,
                questionText: questionTextSaved,
                category: categoryId,
                categoryTitle: categoryTitle,
                answer: answerText,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // Ambient Background
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function createParticle() {
            return {
                x: Math.random() * canvas.width,
                y: canvas.height + 50,
                speedY: -(0.5 + Math.random() * 0.8),
                speedX: (Math.random() - 0.5) * 0.2,
                size: 8 + Math.random() * 12,
                opacity: 0.15 + Math.random() * 0.3
            };
        }
        for (let i = 0; i < 20; i++) particles.push(createParticle());

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, idx) => {
                p.y += p.speedY; p.x += p.speedX;
                if (p.y < -50) particles[idx] = createParticle();
                ctx.save();
                ctx.globalAlpha = p.opacity;
                ctx.font = `${p.size}px Arial`;
                ctx.fillText('💔', p.x, p.y);
                ctx.restore();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
